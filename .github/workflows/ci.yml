# Build + test on every push/PR. GigaClaw.ClaudeMock is built explicitly so the hermetic
# ClaudeRunner integration tests find the mock claude.exe instead of falling back to a real
# CLI (MockClaudeBinFixture walks the repo tree for a previously built binary).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # T1/T2: committed catalog artifacts must remain deterministic. The strict
      # binding gate is enabled after the known content-writer team gap is fixed.
      - name: Catalog drift check
        shell: pwsh
        run: |
          dotnet run --project GigaClaw.Catalog -- generate
          git diff --exit-code -- catalog.json doc/catalog.md
          dotnet run --project GigaClaw.Catalog -- check

      - name: Build
        run: |
          dotnet build GigaClaw.Web -c Release --nologo
          dotnet build GigaClaw.ClaudeMock -c Release --nologo
          dotnet build GigaClaw.Core.Tests -c Release --nologo

      - name: Test
        run: dotnet test GigaClaw.Core.Tests -c Release --no-build --nologo --logger "console;verbosity=minimal"
